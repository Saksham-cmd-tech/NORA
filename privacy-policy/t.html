<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NORA — Live Train Tracking</title>
  <meta name="description" content="Track live train status, current & next stations, delays, and platform numbers privately with NORA.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/favicon.png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card-bg: #1C1C1E;
      --card-secondary: #2C2C2E;
      --separator: #38383A;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --accent: #F5332C;
      --green: #30D158;
      --orange: #FF9F0A;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 90px;
    }

    /* Navigation Header */
    header {
      width: 100%;
      max-width: 520px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--separator);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.25);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.6px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 520px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Card Styling */
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--separator);
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Hero Card (Current & Next Station) */
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .status-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .status-capsule.ontime .dot { background: var(--green); }
    .status-capsule.delayed .dot { background: #FF453A; }
    .status-capsule.notice {
      background: rgba(255, 159, 10, 0.12);
      border-color: rgba(255, 159, 10, 0.3);
      color: #FF9F0A;
    }
    .status-capsule.notice .dot {
      background: #FF9F0A;
    }
    .status-capsule.checking {
      background: rgba(10, 132, 255, 0.12);
      border-color: rgba(10, 132, 255, 0.3);
      color: #0A84FF;
    }
    .status-capsule.checking .dot {
      background: #0A84FF;
      animation: pulseDot 1s infinite alternate;
    }
    @keyframes pulseDot {
      from { opacity: 0.35; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1.15); }
    }
    .status-capsule .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Check Status Action Button */
    .check-status-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-primary);
      padding: 5px 11px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .check-status-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .check-status-btn:active {
      transform: scale(0.96);
    }

    .check-status-btn .icon {
      display: inline-block;
      font-size: 12px;
      transition: transform 0.4s ease;
    }

    .check-status-btn.loading .icon {
      animation: spin 0.7s linear infinite;
    }

    .check-status-btn.loading {
      opacity: 0.75;
      pointer-events: none;
    }

    .hero-stations-row {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
    }

    .hero-station-col {
      flex: 1;
    }

    .hero-station-col.right {
      border-left: 1px solid var(--separator);
      padding-left: 14px;
    }

    .station-eyebrow {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .station-eyebrow.accent {
      color: var(--accent);
      justify-content: flex-start;
      gap: 4px;
    }

    .station-name-hero {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.2px;
      line-height: 1.25;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-meta-hero {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .station-meta-hero.active {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Progress Track */
    .progress-section {
      border-top: 1px solid var(--separator);
      padding-top: 14px;
    }

    .progress-bar-bg {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* Journey Overview (Boarding Pass Card) */
    .journey-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--separator);
      padding: 20px;
    }

    .journey-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .train-badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .train-num-badge {
      background: var(--card-secondary);
      border: 1px solid var(--separator);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .train-title-text {
      font-size: 15px;
      font-weight: 800;
    }

    .journey-date-pill {
      background: var(--card-secondary);
      border: 1px solid var(--separator);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .route-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
    }

    .route-point {
      min-width: 80px;
    }

    .route-point.right {
      text-align: right;
    }

    .route-code {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .route-time {
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
    }

    .route-station-sub {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
      max-width: 95px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-track {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    .route-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.16);
    }

    .route-arrow-pill {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: var(--card-secondary);
      border: 1px solid var(--separator);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-secondary);
      margin: 0 6px;
    }

    .berth-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--separator);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .berth-pill {
      background: var(--card-secondary);
      border: 1px solid var(--separator);
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
    }

    .berth-pill-label {
      font-size: 8px;
      color: var(--text-secondary);
      letter-spacing: 0.6px;
      font-weight: 700;
    }

    .berth-pill-val {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 1px;
    }

    .private-berth-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      width: 100%;
    }

    /* Timeline Halts */
    .timeline-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--separator);
      padding: 20px;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .timeline-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
    }

    .timeline-count {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      min-height: 48px;
      position: relative;
    }

    .timeline-node-col {
      width: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: 12px;
    }

    .timeline-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 800;
      color: #FFFFFF;
      flex-shrink: 0;
      z-index: 2;
    }

    .timeline-dot.covered {
      background: var(--accent);
      border: 1.5px solid var(--accent);
    }

    .timeline-dot.current {
      background: var(--accent);
      border: 2px solid #FFFFFF;
      box-shadow: 0 0 10px rgba(245, 51, 44, 0.75);
      animation: pulseGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 4px rgba(245, 51, 44, 0.4); }
      to { box-shadow: 0 0 14px rgba(245, 51, 44, 0.9); }
    }

    .timeline-dot.upcoming {
      background: #1C1C1E;
      border: 1.5px solid #48484A;
      color: #8E8E93;
    }

    .timeline-line {
      width: 2px;
      flex: 1;
      margin: 2px 0;
      min-height: 24px;
      background: #2C2C2E;
    }

    .timeline-line.covered {
      background: var(--accent);
    }

    .timeline-content {
      flex: 1;
      padding-bottom: 12px;
    }

    .timeline-stn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timeline-stn-name {
      font-size: 14px;
      font-weight: 700;
    }

    .timeline-stn-name.covered {
      color: var(--accent);
    }

    .timeline-stn-name.upcoming {
      color: var(--text-secondary);
    }

    .current-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(245, 51, 44, 0.16);
      border: 1px solid rgba(245, 51, 44, 0.35);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      color: var(--accent);
      margin-left: 6px;
    }

    .platform-pill {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--separator);
      background: var(--card-secondary);
      color: var(--text-secondary);
    }

    .platform-pill.covered {
      border-color: rgba(245, 51, 44, 0.3);
      color: var(--accent);
    }

    .timeline-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Fixed Bottom Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--separator);
      display: flex;
      justify-content: center;
      z-index: 200;
    }

    .bottom-inner {
      width: 100%;
      max-width: 520px;
      display: flex;
      gap: 12px;
    }

    .btn-primary {
      flex: 1;
      background: #FFFFFF;
      color: #000000;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-primary:active {
      opacity: 0.85;
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: var(--text-secondary);
      line-height: 1.5;
      padding: 10px 16px;
    }

    /* Loading & Error States */
    .loading-state, .error-state {
      padding: 40px 20px;
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Early Journey Notice Banner */
    .early-journey-banner {
      background: rgba(255, 159, 10, 0.08);
      border: 1px solid rgba(255, 159, 10, 0.24);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 14px;
      font-size: 12px;
      color: #FFD60A;
      line-height: 1.45;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99999;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #1C1C1E;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 24px 22px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: rgba(255, 159, 10, 0.14);
      border: 1px solid rgba(255, 159, 10, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      color: #FFFFFF;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .modal-schedule-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 22px;
    }

    .modal-btn {
      width: 100%;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      padding: 13px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }

    .modal-btn:hover {
      opacity: 0.9;
    }

    .modal-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Modal Popup for Journeys not of today (> 1 hr away) -->
  <div id="earlyJourneyModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon-badge">⏱️</div>
      <h2 id="earlyJourneyTitle" class="modal-title">Live Tracking Ahead</h2>
      <p class="modal-desc">
        You can use this tracking page <strong>1 hour before the journey</strong> begins. Real-time satellite radar and live station updates will automatically activate then.
      </p>
      <div class="modal-schedule-pill">
        <span>🗓️</span>
        <span id="modalScheduleText">Scheduled Run</span>
      </div>
      <button class="modal-btn" onclick="document.getElementById('earlyJourneyModal').style.display='none'">View Boarding Pass</button>
    </div>
  </div>

  <!-- Navigation Bar -->
  <header>
    <a href="https://nora-privacy-policy.vercel.app" class="brand-group">
      <img src="/logo.png" alt="NORA" class="brand-logo" onerror="this.style.display='none'">
      <span class="brand-title">NORA Live Radar</span>
    </a>
    <div class="header-actions">
      <button id="headerCheckStatusBtn" class="check-status-btn" onclick="triggerStatusCheck()">
        <span class="icon">⟳</span>
        <span class="text">Check Status</span>
      </button>
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="appContent">
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="color: var(--text-secondary); font-size: 13px;">Connecting to National Train Enquiry System...</p>
    </div>
  </main>

  <!-- Sticky Bottom Bar -->
  <div class="bottom-bar">
    <div class="bottom-inner">
      <a id="openAppBtn" href="nora://trip" class="btn-primary">
        <span>⚡ OPEN IN NORA APP</span>
      </a>
    </div>
  </div>

  <script>
    const PROXY_URL = 'https://nora-rail-proxy.saksham-tale02dev.workers.dev';
    const API_KEY = 'nora_rail_sec_9f8b2c4e1a0d3e5f7a6b8c9d0e1f2a3b';

    let currentTripData = null;
    let isFetchingLive = false;

    // Base64URL decoder with UTF-8 support
    function fromBase64Url(str) {
      try {
        let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const binary = atob(b64);
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      } catch (e) {
        return null;
      }
    }

    // Extract trip payload from URL hash or query params
    function parseUrlTrip() {
      const fullUrl = window.location.href;
      let rawData = '';

      // Check hash (#data=...)
      const hash = window.location.hash;
      if (hash) {
        if (hash.startsWith('#data=')) rawData = hash.substring(6);
        else if (hash.startsWith('#')) rawData = hash.substring(1);
      }

      // Check query (?data=...)
      if (!rawData) {
        const match = window.location.search.match(/[?&]data=([^&#]+)/);
        if (match) rawData = match[1];
      }

      if (rawData) {
        const jsonStr = fromBase64Url(rawData);
        if (jsonStr) {
          try {
            const p = JSON.parse(jsonStr);
            return {
              trainNumber: p.t || p.trainNumber || '',
              trainName: p.n || p.trainName || ('Train ' + (p.t || p.trainNumber || '')),
              trainType: p.tt || p.trainType || 'SUPERFAST',
              date: p.d || p.dateOfJourney || p.date || 'Today',
              from: p.f || p.fromStationCode || p.from || '',
              fromName: p.fn || p.fromStationName || p.from || p.f || '',
              to: p.to || p.toStationCode || '',
              toName: p.tn || p.toStationName || p.to || '',
              departure: p.dt || p.departureTime || p.departure || '--:--',
              arrival: p.at || p.arrivalTime || p.arrival || '--:--',
              coach: p.c || p.coach,
              seat: p.s || p.seatNumber || p.seat,
              berth: p.b || p.berthType || p.berth,
              status: p.st || p.status || 'CONFIRMED',
              rawEncoded: rawData,
            };
          } catch(e) {}
        }
      }

      return null;
    }

    // Format time helper
    function formatTime(t) {
      if (!t) return '--:--';
      const m = t.match(/(\d{1,2}):(\d{2})/);
      if (m) {
        let h = parseInt(m[1], 10);
        const min = m[2];
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${String(h).padStart(2, '0')}:${min} ${ampm}`;
      }
      return t;
    }

    // Date & Early Journey Parser
    function parseJourneyDate(dateStr, timeStr) {
      if (!dateStr) return null;
      const now = new Date();
      let year = now.getFullYear();
      let month = now.getMonth();
      let day = now.getDate();

      if (dateStr.toLowerCase() !== 'today') {
        const isoMatch = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (isoMatch) {
          year = parseInt(isoMatch[1], 10);
          month = parseInt(isoMatch[2], 10) - 1;
          day = parseInt(isoMatch[3], 10);
        } else {
          const p = new Date(dateStr);
          if (!isNaN(p.getTime())) {
            year = /\d{4}/.test(dateStr) ? p.getFullYear() : now.getFullYear();
            month = p.getMonth();
            day = p.getDate();
          }
        }
      }

      let h = 0, m = 0;
      if (timeStr) {
        const tm = timeStr.match(/(\d{1,2}):(\d{2})/);
        if (tm) {
          h = parseInt(tm[1], 10);
          m = parseInt(tm[2], 10);
        }
      }

      return new Date(year, month, day, h, m, 0);
    }

    function shouldShowEarlyNotice(dateStr, timeStr) {
      const journeyDt = parseJourneyDate(dateStr, timeStr);
      if (!journeyDt) return false;
      const now = new Date();
      const diffMs = journeyDt.getTime() - now.getTime();
      return diffMs > 60 * 60 * 1000;
    }

    // Query Cloudflare NTES proxy for live status
    async function fetchLiveNTES(trainNumber) {
      try {
        const res = await fetch(`${PROXY_URL}/?train=${encodeURIComponent(trainNumber)}`, {
          headers: { 'X-NORA-API-Key': API_KEY }
        });
        if (res.ok) {
          const json = await res.json();
          if (json?.success) return json;
        }
      } catch (err) {
        console.error('NTES fetch error:', err);
      }
      return null;
    }

    // Real-time status update triggered dynamically without site reload
    async function triggerStatusCheck() {
      if (isFetchingLive || !currentTripData?.trainNumber) return;
      isFetchingLive = true;

      // Update button visual states
      const btns = document.querySelectorAll('.check-status-btn');
      btns.forEach(b => {
        b.classList.add('loading');
        const textSpan = b.querySelector('.text');
        if (textSpan) textSpan.textContent = 'Updating...';
      });

      try {
        const live = await fetchLiveNTES(currentTripData.trainNumber);
        renderView(currentTripData, live, new Date());
      } finally {
        isFetchingLive = false;
        btns.forEach(b => {
          b.classList.remove('loading');
          const textSpan = b.querySelector('.text');
          if (textSpan) textSpan.textContent = 'Check Status';
        });
      }
    }

    function renderView(trip, live, lastUpdatedTime = new Date()) {
      const contentEl = document.getElementById('appContent');
      const openAppBtn = document.getElementById('openAppBtn');

      openAppBtn.href = `nora://trip?data=${trip.rawEncoded}`;

      const isEarly = shouldShowEarlyNotice(trip.date, trip.departure);
      const isInitialLoading = !live && !isEarly;
      const isCompleted = live?.status === 'completed';
      const delayMin = live?.delayMinutes || 0;
      const isDelayed = delayMin > 5;
      const statusText = isEarly
        ? 'LIVE TRACKING INACTIVE'
        : isInitialLoading
        ? 'CHECKING LIVE STATUS...'
        : isCompleted
        ? 'JOURNEY COMPLETED'
        : isDelayed
        ? `${delayMin} MIN DELAY`
        : 'RUNNING ON TIME';
      const statusClass = isEarly ? 'notice' : isInitialLoading ? 'checking' : isDelayed ? 'delayed' : 'ontime';

      // Real active current station
      const currentStationEyebrow = isEarly ? 'ORIGIN STATION' : 'CURRENT STATION';
      const currentStationName = isEarly
        ? (trip.fromName || trip.from)
        : (live?.currentStation || (isInitialLoading ? 'Locating Live Train...' : (trip.fromName || trip.from)));
      const currentStationCode = isEarly ? trip.from : (live?.currentStationCode || trip.from);
      let currentStationTime = '';
      if (isEarly) {
        currentStationTime = `Scheduled departure at ${formatTime(trip.departure)}`;
      } else if (live?.currentStatus && live.currentStatus.toLowerCase().includes('departed')) {
        const match = live.currentStatus.match(/at\s+([\d:]+\s*(?:[A-Za-z0-9\-]+)?)/i);
        currentStationTime = match ? `Departed at ${match[1]}` : live.currentStatus;
      } else if (isInitialLoading) {
        currentStationTime = 'Connecting to NTES satellite radar...';
      } else {
        currentStationTime = `Scheduled ${formatTime(trip.departure)}`;
      }

      // Next station
      const nextStationName = live?.nextHalt || trip.toName || trip.to;
      const nextStationCode = live?.nextHaltCode || trip.to;
      const nextEta = live?.nextHaltEta ? formatTime(live.nextHaltEta) : formatTime(trip.arrival);
      const nextPlatform = live?.platform && live.platform !== 'TBD' ? `Platform ${live.platform}` : '';

      // Stations list & timeline resolution
      let stations = [];
      let lastCoveredIdx = -1;

      if (!isEarly && Array.isArray(live?.stations) && live.stations.length > 0) {
        stations = live.stations;
        stations.forEach((s, i) => {
          if (s.isDeparted === true || s.isArrived === true) lastCoveredIdx = i;
        });
        if (live?.currentStationCode) {
          const matchIdx = stations.findIndex(s => (s.stationCode || '').toUpperCase() === live.currentStationCode.toUpperCase());
          if (matchIdx !== -1) lastCoveredIdx = matchIdx;
        }
      } else {
        // Fallback / Initial route progression timeline so timeline is always visible
        stations = [
          {
            stationCode: trip.from,
            stationName: trip.fromName || trip.from,
            scheduledDeparture: formatTime(trip.departure),
            isDeparted: !isEarly,
            isArrived: !isEarly,
          },
          {
            stationCode: 'RADAR',
            stationName: isEarly ? 'Upcoming Journey Telemetry' : 'En-Route Live Telemetry',
            scheduledDeparture: isEarly ? 'Tracking opens 1 hr before departure' : isInitialLoading ? 'Querying CRIS/NTES proxy...' : 'Live tracking active',
            isDeparted: false,
            isArrived: false,
          },
          {
            stationCode: trip.to,
            stationName: trip.toName || trip.to,
            scheduledArrival: formatTime(trip.arrival),
            isDeparted: false,
            isArrived: false,
          }
        ];
        lastCoveredIdx = isEarly ? -1 : 0;
      }

      const passedCount = stations.filter(s => s.isDeparted === true || s.isArrived === true).length;
      const progressPercent = isEarly ? 0 : stations.length > 0 ? Math.round((passedCount / stations.length) * 100) : 40;
      const timeString = lastUpdatedTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      contentEl.innerHTML = `
        <!-- 1. Hero Radar Card (Current & Next Station) -->
        <div class="card">
          <div class="hero-top-row">
            <div class="status-capsule ${statusClass}">
              <div class="dot"></div>
              <span>${statusText}</span>
            </div>

            <!-- In-card check status button -->
            <button class="check-status-btn" onclick="triggerStatusCheck()">
              <span class="icon">⟳</span>
              <span class="text">Check Status</span>
            </button>
          </div>

          <div class="hero-stations-row">
            <!-- CURRENT / ORIGIN STATION -->
            <div class="hero-station-col">
              <div class="station-eyebrow">
                <span>${currentStationEyebrow}</span>
              </div>
              <div class="station-name-hero">${currentStationName}</div>
              <div class="station-meta-hero">${currentStationTime}</div>
            </div>

            <!-- NEXT / DESTINATION STATION -->
            <div class="hero-station-col right">
              <div class="station-eyebrow accent">● ${isEarly ? 'DESTINATION' : 'NEXT STATION'}</div>
              <div class="station-name-hero">${nextStationName}</div>
              <div class="station-meta-hero active">
                ${isEarly ? `Expected ${formatTime(trip.arrival)}` : `ETA ${nextEta} ${nextPlatform ? `· ${nextPlatform}` : ''}`}
              </div>
            </div>
          </div>

          ${isEarly ? `
            <div class="early-journey-banner">
              <span>⏱️</span>
              <span>Live tracking will become active <strong>1 hour before departure</strong> (${trip.date} at ${formatTime(trip.departure)}).</span>
            </div>
          ` : ''}

          <!-- Connecting Progress Track -->
          <div class="progress-section">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
            </div>
            <div class="progress-footer">
              <span>${currentStationCode}</span>
              <span>${isEarly ? `Departure in ${trip.date}` : nextPlatform ? `Next halt at ${nextPlatform}` : `${progressPercent}% route covered`} · Updated ${timeString}</span>
              <span>${nextStationCode}</span>
            </div>
          </div>
        </div>

        <!-- 2. Journey Boarding Pass Card -->
        <div class="journey-card">
          <div class="journey-header">
            <div class="train-badge-group">
              <span class="train-num-badge">${trip.trainNumber}</span>
              <span class="train-title-text">${trip.trainName}</span>
            </div>
            <div class="journey-date-pill">${trip.date}</div>
          </div>

          <div class="route-row">
            <div class="route-point">
              <div class="route-code">${trip.from}</div>
              <div class="route-time">${formatTime(trip.departure)}</div>
              <div class="route-station-sub">${trip.fromName}</div>
            </div>

            <div class="route-track">
              <div class="route-line"></div>
              <div class="route-arrow-pill">→</div>
              <div class="route-line"></div>
            </div>

            <div class="route-point right">
              <div class="route-code">${trip.to}</div>
              <div class="route-time">${formatTime(trip.arrival)}</div>
              <div class="route-station-sub">${trip.toName}</div>
            </div>
          </div>

          <div class="berth-section">
            ${trip.coach && trip.seat ? `
              <div class="berth-pill">
                <div class="berth-pill-label">COACH</div>
                <div class="berth-pill-val">${trip.coach}</div>
              </div>
              <div class="berth-pill">
                <div class="berth-pill-label">SEAT</div>
                <div class="berth-pill-val">${trip.seat}</div>
              </div>
              ${trip.berth ? `
                <div class="berth-pill">
                  <div class="berth-pill-label">TYPE</div>
                  <div class="berth-pill-val">${trip.berth}</div>
                </div>
              ` : ''}
            ` : `
              <div class="private-berth-pill">
                <span>🛡️</span>
                <span>Coach & seat details kept private by traveler</span>
              </div>
            `}
          </div>
        </div>

        <!-- 3. Halts Timeline (Covered in Accent, Upcoming in Gray) -->
        <div class="timeline-card">
          <div class="timeline-header">
            <span class="timeline-title">${isEarly ? 'SCHEDULED ROUTE TIMELINE' : 'ROUTE HALTS & LIVE TIMELINE'}</span>
            <span class="timeline-count">
              ${!isEarly && Array.isArray(live?.stations) && live.stations.length > 0 
                ? `${passedCount} of ${stations.length} covered`
                : 'Route Progression'}
            </span>
          </div>

          ${stations.map((stn, idx) => {
            const isCovered = idx <= lastCoveredIdx && lastCoveredIdx >= 0;
            const isCurrent = idx === lastCoveredIdx && lastCoveredIdx >= 0;
            const dotClass = isCurrent ? 'current' : isCovered ? 'covered' : 'upcoming';
            const lineClass = isCovered ? 'covered' : '';
            const nameClass = isCovered ? 'covered' : 'upcoming';
            const displayTime = stn.expectedDeparture || stn.expectedArrival || stn.scheduledDeparture || stn.scheduledArrival || '--:--';

            return `
              <div class="timeline-item">
                <div class="timeline-node-col">
                  <div class="timeline-dot ${dotClass}">
                    ${isCovered ? (isCurrent ? '●' : '✓') : ''}
                  </div>
                  ${idx < stations.length - 1 ? `<div class="timeline-line ${lineClass}"></div>` : ''}
                </div>
                <div class="timeline-content">
                  <div class="timeline-stn-row">
                    <div style="display: flex; align-items: center; gap: 6px;">
                      <span class="timeline-stn-name ${nameClass}">${stn.stationName || stn.stationCode}</span>
                      ${isCurrent ? `<span class="current-badge">● CURRENT</span>` : ''}
                    </div>
                    ${stn.platform && stn.platform !== 'TBD' ? `
                      <span class="platform-pill ${isCovered ? 'covered' : ''}">PF ${stn.platform}</span>
                    ` : ''}
                  </div>
                  <div class="timeline-time">
                    ${displayTime}
                    ${stn.delayDepartureMinutes && stn.delayDepartureMinutes !== 'On Time' && stn.delayDepartureMinutes !== '' ? `
                      <span style="color: var(--accent); margin-left: 4px; font-weight: 600;">(${stn.delayDepartureMinutes} late)</span>
                    ` : ''}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="footer-note">
          🔒 Private & Stateless · Zero traveler credentials or PNRs are logged on remote servers.
        </div>
      `;
    }

    async function init() {
      currentTripData = parseUrlTrip();
      const contentEl = document.getElementById('appContent');

      if (!currentTripData || !currentTripData.trainNumber) {
        contentEl.innerHTML = `
          <div class="card error-state">
            <h2 style="font-size: 18px; margin-bottom: 8px;">No Trip Link Found</h2>
            <p style="color: var(--text-secondary); font-size: 13px; line-height: 1.5; margin-bottom: 20px;">
              This tracking link is missing journey details. Open NORA on Android to generate or share a live link.
            </p>
            <a href="https://play.google.com/store/apps/details?id=dev.saksham.nora" class="btn-primary" style="display: inline-flex;">
              Get NORA on Google Play
            </a>
          </div>
        `;
        return;
      }

      // 1. Immediately render initial trip view from URL payload
      renderView(currentTripData, null, new Date());

      // 2. If journey is not of today / > 1 hr away, display early modal popup
      const isEarly = shouldShowEarlyNotice(currentTripData.date, currentTripData.departure);
      if (isEarly) {
        const scheduleSpan = document.getElementById('modalScheduleText');
        if (scheduleSpan) {
          scheduleSpan.textContent = `${currentTripData.date} at ${formatTime(currentTripData.departure)}`;
        }
        const modal = document.getElementById('earlyJourneyModal');
        if (modal) {
          modal.style.display = 'flex';
        }
      } else {
        // Automatically trigger live status check on page load if journey is today/active
        triggerStatusCheck();
      }
    }

    // Initialize on page load and hash change
    window.addEventListener('DOMContentLoaded', init);
    window.addEventListener('hashchange', init);
  </script>
</body>
</html>
