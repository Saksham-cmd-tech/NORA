plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = "io.github.react-native-community:jsc-android:2026004.+"
def isHermesEnabled = project.findProperty("hermesEnabled") != null ? project.findProperty("hermesEnabled").toString().toBoolean() : true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk (rootProject.ext.compileSdkVersion as Integer)

    namespace "com.nora.wallet"
    defaultConfig {
        applicationId "com.nora.wallet"
        minSdkVersion (rootProject.ext.minSdkVersion as Integer)
        targetSdkVersion (rootProject.ext.targetSdkVersion as Integer)
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (project.hasProperty("NORA_RELEASE_STORE_FILE")) {
                storeFile file(project.findProperty("NORA_RELEASE_STORE_FILE"))
                storePassword project.findProperty("NORA_RELEASE_STORE_PASSWORD")
                keyAlias project.findProperty("NORA_RELEASE_KEY_ALIAS")
                keyPassword project.findProperty("NORA_RELEASE_KEY_PASSWORD")
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (isHermesEnabled) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation(jscFlavor)
    }
}
